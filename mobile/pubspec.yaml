name: fidel_assistant
description: Compagnon d'accompagnement patient — rappels médicaments, offline-first.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.3
  intl: any
  google_sign_in: ^6.2.2
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  go_router: ^14.6.2
  flutter_svg: ^2.3.0
  lottie: ^3.5.1
  permission_handler: ^13.0.2
  iconsax_plus: ^1.0.0
  file_picker: ^8.1.7
  record: ^6.0.0
  path_provider: ^2.1.5
  path: ^1.9.0
  flutter_timezone: ^5.1.0
  alarm: ^5.12.0
  uuid: ^4.5.1
  drift: ^2.26.0
  sqlite3_flutter_libs: ^0.5.28
  sqlite3: ^2.7.5
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.6
  image_picker: ^1.1.2
  local_auth: ^2.3.0
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.26.0
  build_runner: ^2.4.15

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/mood/
    - assets/lottie/
    - assets/config/app.json
    - assets/sounds/

  fonts:
    - family: Satoshi
      fonts:
        - asset: assets/fonts/Satoshi-Regular.otf
          weight: 400
        - asset: assets/fonts/Satoshi-Medium.otf
          weight: 500
        - asset: assets/fonts/Satoshi-Medium.otf
          weight: 600
        - asset: assets/fonts/Satoshi-Bold.otf
          weight: 700
